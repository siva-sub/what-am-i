name: Deploy to GitHub Pages

# GitHub Pages is static hosting, which is exactly what this game needs:
# there is no server anywhere. The waiting rooms run over a public relay
# and the whole thing is plain files. So publishing is "copy the folder",
# with one gate in front of it.
#
# Every action is pinned to a commit SHA rather than a moving tag. A tag
# can be repointed at new code by whoever owns the action, and this
# workflow runs with `pages: write` and an OIDC token — so a hijacked tag
# would be a live supply-chain hole, not a hypothetical one.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deny by default; each job asks for only what it needs.
permissions: {}

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The rules engine is pure and dependency-free, so it runs in bare
      # Node. If a rule regresses, the site does not go out.
      - name: Rules engine
        run: node tools/test-rules.mjs

      # Names and avatars arrive over the network and are rendered as
      # markup. This suite is the boundary; it does not get to regress.
      - name: Input boundary
        run: node tools/test-sanitize.mjs

      # Neither esc() nor cleanName() neutralises a URI scheme, so the
      # only thing keeping a javascript: URL out of the page is that no
      # name is ever written into an href or a src. That is an
      # architectural fact, so it is checked rather than trusted.
      - name: No player string reaches a URL
        run: node tools/check-url-sinks.mjs

      # A module that 404s is invisible until someone clicks a button on
      # the live site, so walk the whole import graph first.
      - name: Every referenced file exists
        run: node tools/check-assets.mjs

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
